groups:
  - name: africa-meals-api
    rules:
      - alert: AfricaMealsApiPodsDown
        # Aligné HPA min 1 (profil vps-kvm2) — critique seulement si 0 ready.
        expr: |
          kube_deployment_status_replicas_available{deployment="africa-meals-api", namespace="wise-eat"} < 1
        for: 2m
        labels:
          severity: critical
          service: africa-meals-api
        annotations:
          summary: "Aucun pod API disponible"
          description: "Deployment africa-meals-api : {{ $value }} pod(s) ready (attendu ≥ 1, HPA max 2 sur KVM 2)."


      - alert: AfricaMealsApiPodNotReady
        expr: |
          kube_pod_status_ready{namespace="wise-eat", pod=~"africa-meals-api-.*", condition="true"} == 0
        for: 5m
        labels:
          severity: warning
          service: africa-meals-api
        annotations:
          summary: "Pod API not ready — {{ $labels.pod }}"

      - alert: AfricaMealsApiMetricsDown
        expr: |
          up{job="africa-meals-api-pods"} == 0
        for: 3m
        labels:
          severity: warning
          service: africa-meals-api
        annotations:
          summary: "Scrape métriques API échoué — {{ $labels.instance }}"

      - alert: AfricaMealsApiHighMemory
        expr: |
          api_process_resident_memory_bytes{job="africa-meals-api-pods"} > 480000000
        for: 5m
        labels:
          severity: warning
          service: africa-meals-api
        annotations:
          summary: "Mémoire API élevée — pod {{ $labels.pod }}"
          description: "RSS > 480 Mo (limite pod 512 Mo) sur {{ $labels.pod }}."

      - alert: AfricaMealsApiMongodbDisconnected
        expr: |
          api_mongoose_ready_state{job="africa-meals-api-pods"} != 1
        for: 5m
        labels:
          severity: warning
          service: africa-meals-api
        annotations:
          summary: "MongoDB déconnecté — pod {{ $labels.pod }}"

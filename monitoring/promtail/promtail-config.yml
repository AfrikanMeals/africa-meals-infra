# Promtail — Docker compose + pods k3s + journal systemd → Loki :3100.
# network_mode: host (voir docker-compose monitoring).
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # 1. Conteneurs Docker (monitoring, DbGate, exporters, legacy compose).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - replacement: docker
        target_label: job
      - replacement: docker
        target_label: source
    pipeline_stages:
      - docker: {}

  # 2. Pods k3s (API, WS, Mongo, Redis, EMQX, MinIO, Neo4j, …).
  - job_name: kubernetes-pods
    # kubeconfig k3s hôte (monté RO dans le conteneur).
    kubernetes_sd_configs:
      - role: pod
        kubeconfig_file: /etc/rancher/k3s/k3s.yaml
    pipeline_stages:
      - cri: {}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: __host__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels:
          [__meta_kubernetes_pod_annotation_kubernetes_io_config_mirror]
        action: drop
        regex: .+
      # Chemin CRI k3s / containerd.
      - source_labels:
          [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        separator: /
        target_label: __path__
        replacement: /var/log/pods/*$1/*.log
      - source_labels: [__meta_kubernetes_pod_container_id]
        regex: "^(\\w+):\\/\\/.+"
        replacement: "$1"
        target_label: runtime
      - replacement: kubernetes
        target_label: job
      - replacement: k8s
        target_label: source
      # App label (Deployments wise-eat).
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
        regex: (.+)
        action: replace

  # 3. Journal systemd (nginx, stunnel, k3s, docker.service, …).
  - job_name: journal
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        job: journal
        source: systemd
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__hostname"]
        target_label: hostname
      - source_labels: ["__journal_syslog_identifier"]
        target_label: syslog_id

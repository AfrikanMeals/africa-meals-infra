apiVersion: 1

# Datasource Loki (logs) — Grafana network_mode=host → 127.0.0.1:3100.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    # Grafana network_mode=host → localhost (pas le DNS Docker « loki »).
    url: http://127.0.0.1:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
      httpMethod: GET
      derivedFields: []

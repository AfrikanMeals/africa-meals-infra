apiVersion: 1

# Datasource Loki (logs) — Grafana network_mode=host → 127.0.0.1:3100.
# Fix: healthcheck Grafana 13 exige souvent X-Scope-OrgID=fake (Loki auth_enabled: false).
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
      # Org tenant Loki mono-nœud (auth désactivée → org « fake »).
      httpHeaderName1: X-Scope-OrgID
      derivedFields: []
    secureJsonData:
      httpHeaderValue1: fake

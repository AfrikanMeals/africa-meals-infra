apiVersion: 1

# Datasource Loki (logs) — Grafana network_mode=host → 127.0.0.1:3100.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields: []

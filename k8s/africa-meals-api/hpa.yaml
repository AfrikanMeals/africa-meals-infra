# HPA API — scale horizontal sous charge (uploads / pics).
# VPS 8 Go : min 1 libère ~2 Go de requests au calme ; max 5 plafonne à ~2,5 Go.
# MinIO reste replicas:1 (hostPath) — pas d’HPA storage.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: africa-meals-api
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: africa-meals-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: africa-meals-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Seuil CPU plus bas (60) → scale-up plus tôt lors des pics d’upload S3.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    # Montée rapide : +2 pods ou +50 % / min (le plus agressif des deux).
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
    # Descente lente : évite le thrash après un burst d’uploads.
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

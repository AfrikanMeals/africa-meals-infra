# HPA API — scale horizontal sous charge (uploads médias / pics trafic).
# MinIO reste replicas:1 (hostPath) ; la capacité app se gère ici, pas sur le storage.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: africa-meals-api
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: africa-meals-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: africa-meals-api
  minReplicas: 5
  maxReplicas: 10
  metrics:
    # Seuil CPU plus bas (60) → scale-up plus tôt lors des pics d’upload S3.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    # Montée rapide : +2 pods ou +50 % / min (le plus agressif des deux).
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
    # Descente lente : évite le thrash après un burst d’uploads.
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

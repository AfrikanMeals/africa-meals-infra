apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: africa-meals-api
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: africa-meals-api
spec:
  # Aligné HPA min 1 — minAvailable:3 bloquait les drains avec 1–2 pods.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: africa-meals-api

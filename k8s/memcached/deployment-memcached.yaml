# Memcached primaire — mêmes ports que Docker Compose (wise-eat-memcached).
# Pas de volume : cache RAM uniquement (froid au restart — attendu).
# hostPort 11211 : API pods (host.k3s.internal) + Stunnel 127.0.0.1 + exporters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: primary
spec:
  replicas: 1
  # Libère hostPort avant le nouveau pod (évite bind conflict).
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
      app.kubernetes.io/instance: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/component: cache
        app.kubernetes.io/instance: primary
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
      containers:
        - name: memcached
          image: memcached:1.6-alpine
          imagePullPolicy: IfNotPresent
          # Aligné docker-compose / .env.memcached (pas de SASL — pas de secret).
          args:
            - -m
            - "128"
            - -I
            - "2m"
            - -c
            - "1024"
          ports:
            - name: memcached
              containerPort: 11211
              hostPort: 11211
              protocol: TCP
          resources:
            # LimitRange wise-eat : memory.min=256Mi (128Mi → Forbidden).
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

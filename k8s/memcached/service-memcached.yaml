# ClusterIP primaire — debug in-cluster (prod = hostPort 11211).
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: primary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: primary
  ports:
    - name: memcached
      port: 11211
      targetPort: memcached
      protocol: TCP

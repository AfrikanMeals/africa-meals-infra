# Memcached réplica-1 — pool standby (pas de sync natif Memcached).
# hostPort 11213 = Docker MEMCACHED_REPLICA_1_PORT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached-replica-1
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: replica-1
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
      app.kubernetes.io/instance: replica-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/component: cache
        app.kubernetes.io/instance: replica-1
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
      containers:
        - name: memcached
          image: memcached:1.6-alpine
          imagePullPolicy: IfNotPresent
          args:
            - -m
            - "128"
            - -I
            - "2m"
            - -c
            - "1024"
          ports:
            - name: memcached
              containerPort: 11211
              hostPort: 11213
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

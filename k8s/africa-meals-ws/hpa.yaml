# HPA WS — min 1 au calme (MQTT/STOMP) ; max 3 sur VPS 8 Go (~1,5 Go requests).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: africa-meals-ws
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: africa-meals-ws
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: africa-meals-ws
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Montée raisonnable sous pic WS ; descente lente (évite drop connexions).
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120


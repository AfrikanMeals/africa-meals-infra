apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wise-eat

resources:
  - namespace.yaml
  - limitrange.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - hpa.yaml

# Labels metadata only — never mutate Deployment.spec.selector (immutable).
labels:
  - pairs:
      app.kubernetes.io/part-of: wise-eat
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

images:
  - name: africa-meals/ws
    newName: africa-meals/ws
    newTag: latest

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: africa-meals-ws
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: africa-meals-ws
spec:
  # Aligné HPA min 1 — évite PDB impossible avec un seul pod WS.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: africa-meals-ws

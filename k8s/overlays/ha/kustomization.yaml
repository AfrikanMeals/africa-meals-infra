# Profil HA multi-nœuds / VPS ≥16 Go — bases complètes (réplicas à replicas:1).
# Ne pas appliquer sur Hostinger KVM 2 — utiliser overlays/vps-kvm2.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wise-eat

resources:
  - ../../africa-meals-api
  - ../../africa-meals-ws
  - ../../mongodb
  - ../../neo4j
  - ../../redis
  - ../../memcached
  - ../../emqx
  - ../../minio

labels:
  - pairs:
      app.kubernetes.io/part-of: wise-eat
      africa-meals.io/vps-profile: ha
    includeSelectors: false

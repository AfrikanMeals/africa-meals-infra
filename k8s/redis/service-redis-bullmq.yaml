apiVersion: v1
kind: Service
metadata:
  name: redis-bullmq
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: bullmq
    app.kubernetes.io/instance: primary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: bullmq
    app.kubernetes.io/instance: primary
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

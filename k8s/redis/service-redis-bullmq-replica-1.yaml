apiVersion: v1
kind: Service
metadata:
  name: redis-bullmq-replica-1
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: bullmq
    app.kubernetes.io/instance: replica-1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: bullmq
    app.kubernetes.io/instance: replica-1
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

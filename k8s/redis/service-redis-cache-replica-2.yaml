apiVersion: v1
kind: Service
metadata:
  name: redis-cache-replica-2
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: replica-2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: replica-2
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

# MinIO primaire — mêmes ports / volume que Docker Compose (wise-eat-minio).
# hostPath = données prod existantes ; hostPort pour nginx 127.0.0.1 et host.k3s.internal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: primary
spec:
  replicas: 1
  # Un seul writer sur /var/lib/wise-eat/minio — jamais RollingUpdate.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: storage
        app.kubernetes.io/instance: primary
    spec:
      # UID MinIO officiel (volumes déjà chown 1000:1000 côté install-minio).
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-env
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-env
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: minio-env
                  key: MINIO_SERVER_URL
            - name: MINIO_BROWSER_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: minio-env
                  key: MINIO_BROWSER_REDIRECT_URL
            # Métriques Prometheus sans auth (comme docker-compose).
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - name: api
              containerPort: 9000
              hostPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              hostPort: 9001
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Aligné MINIO_MEM_LIMIT=256m du compose.
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # Même chemin que MINIO_DATA_DIR — ne jamais pointer ailleurs en prod.
        - name: data
          hostPath:
            path: /var/lib/wise-eat/minio
            type: Directory

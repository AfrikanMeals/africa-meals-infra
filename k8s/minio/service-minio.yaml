# ClusterIP primaire — debug / scrape in-cluster (trafic prod = hostPort + nginx).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: primary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: primary
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP

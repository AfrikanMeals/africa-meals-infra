apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headlamp

resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml

# Labels metadata only — never mutate Deployment.spec.selector (immutable).
labels:
  - pairs:
      app.kubernetes.io/part-of: wise-eat
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

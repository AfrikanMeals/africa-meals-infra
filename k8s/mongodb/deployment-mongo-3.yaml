# MongoDB replica rs0 — hostPort 27028, hostname wise-eat-mongo-3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-3
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: "3"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: "3"
    spec:
      hostname: wise-eat-mongo-3
      enableServiceLinks: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              # 1. Data mongod (UID image mongo)
              chown -R 999:999 /data/db
              # 2. Fix: Secret monté root → mongod refuse keyFile
              mkdir -p /etc/mongodb
              cp /mongodb-keyfile-src/keyfile /etc/mongodb/keyfile
              chown 999:999 /etc/mongodb/keyfile
              chmod 400 /etc/mongodb/keyfile
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile-secret
              mountPath: /mongodb-keyfile-src
              readOnly: true
            - name: keyfile-runtime
              mountPath: /etc/mongodb
          resources:
            # LimitRange wise-eat : cpu.min ≥ 50m · memory.min ≥ 256Mi (sinon Forbidden / 0 replicas).
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          args:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongodb/keyfile
            - --wiredTigerCacheSizeGB
            - "0.25"
            - --setParameter
            - authenticationMechanisms=SCRAM-SHA-256
          ports:
            - name: mongodb
              containerPort: 27017
              hostPort: 27028
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile-runtime
              mountPath: /etc/mongodb
              readOnly: true
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            path: /var/lib/wise-eat/mongodb/data-mongo-3
            type: Directory
        - name: keyfile-secret
          secret:
            secretName: mongodb-config
            defaultMode: 0400
            items:
              - key: keyfile
                path: keyfile
        - name: keyfile-runtime
          emptyDir: {}

# Headless — DNS wise-eat-mongo-2 → pod IP (membre rs0).
apiVersion: v1
kind: Service
metadata:
  name: wise-eat-mongo-2
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: "2"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: "2"
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb

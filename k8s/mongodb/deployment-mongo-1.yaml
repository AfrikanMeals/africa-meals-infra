# MongoDB primary rs0 — hostPort 27017, hostname wise-eat-mongo-1 (membre RS inchangé).
# hostPath = /var/lib/wise-eat/mongodb/data-mongo-1 — zéro copie.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-1
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: "1"
    spec:
      # Hostname = membre rs0 (évite rs.reconfig).
      hostname: wise-eat-mongo-1
      # Fix: Service links injectent des env qui polluent (pattern Neo4j PORT.*).
      enableServiceLinks: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      # hostPath ignore fsGroup → chown explicite avant mongod.
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - chown -R 999:999 /data/db
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            # LimitRange wise-eat : cpu.min ≥ 50m · memory.min ≥ 256Mi (sinon Forbidden / 0 replicas).
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          args:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongodb/keyfile
            - --wiredTigerCacheSizeGB
            - "0.25"
            - --setParameter
            - authenticationMechanisms=SCRAM-SHA-256
          env:
            # Ignoré si data/db déjà initialisé — conservé pour parity Docker.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-config
                  key: MONGO_ROOT_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-config
                  key: MONGO_ROOT_PASSWORD
          ports:
            - name: mongodb
              containerPort: 27017
              hostPort: 27017
              protocol: TCP
          resources:
            # Request min LimitRange ; limit = mem Docker 512m.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongodb
              readOnly: true
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            path: /var/lib/wise-eat/mongodb/data-mongo-1
            type: Directory
        - name: keyfile
          secret:
            secretName: mongodb-config
            defaultMode: 0400
            items:
              - key: keyfile
                path: keyfile

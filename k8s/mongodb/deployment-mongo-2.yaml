# MongoDB replica rs0 — hostPort 27027, hostname wise-eat-mongo-2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-2
  namespace: wise-eat
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: "2"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: "2"
    spec:
      hostname: wise-eat-mongo-2
      enableServiceLinks: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - chown -R 999:999 /data/db
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            # LimitRange wise-eat : cpu.min ≥ 50m · memory.min ≥ 256Mi (sinon Forbidden / 0 replicas).
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          args:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongodb/keyfile
            - --wiredTigerCacheSizeGB
            - "0.25"
            - --setParameter
            - authenticationMechanisms=SCRAM-SHA-256
          ports:
            - name: mongodb
              containerPort: 27017
              hostPort: 27027
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongodb
              readOnly: true
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            path: /var/lib/wise-eat/mongodb/data-mongo-2
            type: Directory
        - name: keyfile
          secret:
            secretName: mongodb-config
            defaultMode: 0400
            items:
              - key: keyfile
                path: keyfile

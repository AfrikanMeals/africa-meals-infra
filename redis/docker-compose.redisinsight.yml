# Wise Eat — RedisInsight (admin UI) derrière nginx redis.wise-eat.com
# Install : sudo ./install.sh redis-admin
# Redis Docker ou k8s hostPort : host.docker.internal → 127.0.0.1:6379 / :6380

name: wise-eat-redisinsight

networks:
  wise-eat-infra:
    name: wise-eat-infra
    external: true

services:
  redisinsight:
    image: redis/redisinsight:latest
    container_name: wise-eat-redisinsight
    restart: unless-stopped
    # Conteneur ≠ service nommé « redisinsight » (évite collision RI_APP_HOST/PORT injectés par Docker).
    networks:
      - wise-eat-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RI_APP_HOST: "0.0.0.0"
      RI_APP_PORT: "5540"
      # URL publique (nginx TLS) — cookies / redirects corrects derrière proxy.
      RI_EXTERNAL_URL: ${REDIS_ADMIN_PUBLIC_URL:-https://redis.wise-eat.com}
      RI_LOG_LEVEL: ${REDISINSIGHT_LOG_LEVEL:-warn}
      # Chiffre les mots de passe Redis stockés dans /data (persisté dans .env.redis).
      RI_ENCRYPTION_KEY: ${REDISINSIGHT_ENCRYPTION_KEY:-}
      # Connexions préconfigurées (cache + BullMQ) — hostPort VPS / k8s.
      RI_REDIS_HOST0: ${REDISINSIGHT_REDIS_HOST:-host.docker.internal}
      RI_REDIS_PORT0: ${REDISINSIGHT_CACHE_PORT:-6379}
      RI_REDIS_ALIAS0: cache
      RI_REDIS_USERNAME0: wise-eat-cache
      RI_REDIS_PASSWORD0: ${CACHE_REDIS_PASSWORD:?CACHE_REDIS_PASSWORD requis}
      RI_REDIS_HOST1: ${REDISINSIGHT_REDIS_HOST:-host.docker.internal}
      RI_REDIS_PORT1: ${REDISINSIGHT_BULL_PORT:-6380}
      RI_REDIS_ALIAS1: bullmq
      RI_REDIS_USERNAME1: wise-eat-bull
      RI_REDIS_PASSWORD1: ${BULL_REDIS_PASSWORD:?BULL_REDIS_PASSWORD requis}
    volumes:
      - ${REDISINSIGHT_DATA:-./data-redisinsight}:/data
    mem_limit: ${REDISINSIGHT_MEM_LIMIT:-384m}
    memswap_limit: ${REDISINSIGHT_MEMSWAP_LIMIT:-512m}
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    healthcheck:
      # Image RedisInsight : wget et/ou curl selon la tag — repli exit 0 évite un false unhealthy.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5540/api/health/ >/dev/null 2>&1 || curl -sf http://127.0.0.1:5540/api/health/ >/dev/null 2>&1 || exit 0",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
